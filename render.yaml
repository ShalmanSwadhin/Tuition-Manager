# Render Blueprint — New > Blueprint in the Render dashboard, pick this repo.
# Values marked `sync: false` are prompted for when you create the service.
services:
  - type: web
    name: tuition-manager-api
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev: NODE_ENV=production would otherwise skip TypeScript/@types,
    # which the build needs.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false
